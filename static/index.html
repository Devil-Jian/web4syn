<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>web4syn · 临床评阅平台</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><div class="brand"><span class="brand-mark">W</span><span>web4syn <small>2D Clinical Reader Study</small></span></div><div id="who"></div></header>
<main>
<section id="login" class="panel login"><h1>医生评阅系统</h1><p class="muted">双盲 2D CECT 图像评价与诊断效能研究</p>
<form id="login-form"><label>用户名<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">登录</button></form></section>
<section id="workspace" hidden>
<div class="intro"><div><h1>评阅工作台</h1><p class="muted">影像真实性 · 五级质量评分 · 病灶分类</p></div><button class="ghost" id="logout">退出登录</button></div>
<div id="dashboard"><div class="grid2"><div class="panel module"><div class="tag">MODULE 01</div><h2>图像质量与真实性</h2><p>真实/合成盲判与 1–5 分图像质量评价。</p><button data-module="quality">查看质量评阅任务</button></div><div class="panel module"><div class="tag">MODULE 02</div><h2>诊断效能评价</h2><p>NCCT + 多期相增强图像，完成病灶分类与置信度评价。</p><button data-module="diagnosis">查看诊断评阅任务</button></div></div>
<div id="admin" class="panel" hidden><h2>研究管理</h2>
<div class="grid2">
<form id="reader-form"><h3>新增医生账号</h3><label>用户名<input name="username" required></label><label>显示名<input name="display_name" required></label><label>初始密码（≥12 字符）<input name="password" type="password" minlength="12" required></label><button>创建医生</button></form>
<form id="upload-form"><h3>上传匿名 2D 图像</h3><label>匿名患者编码<input name="patient_code" required></label><label>评阅模块<select name="module"><option value="quality">图像质量</option><option value="diagnosis">诊断效能</option></select></label><label>真实类型<select name="source"><option value="real">Real CECT</option><option value="virtual">Virtual CECT</option></select></label><label>期相<select name="phase"><option>NCCT</option><option>AP</option><option>PVP</option><option>DP</option></select></label><label>参考诊断（可选）<select name="reference_label"><option value="">不指定</option><option>HCC</option><option>ICC</option><option>MET</option><option>FNH</option><option>HEM</option><option>CYST</option><option>OTHER</option><option>NONE</option></select></label><label>影像 PNG/JPEG<input name="file" type="file" accept=".png,.jpg,.jpeg" required></label><button>上传图像</button></form></div>
<div class="admin-actions"><button id="generate">生成盲法任务（试运行）</button><button class="ghost" id="progress">刷新进度</button><button class="ghost" data-export="quality">导出质量数据 CSV</button><button class="ghost" data-export="diagnosis">导出诊断数据 CSV</button></div><div id="progress-table"></div></div></div>
<div id="tasklist" class="panel" hidden><div class="line"><h2 id="list-title">待评阅任务</h2><button class="ghost" id="back">返回工作台</button></div><div id="task-rows"></div></div>
<div id="reader" hidden><div class="line taskhead"><div><div class="muted" id="case-code"></div><h2 id="task-title"></h2></div><div class="line"><span id="elapsed" class="timer">00:00</span><button class="ghost" id="back-list">返回任务列表</button></div></div>
<div class="reader-layout"><div id="images" class="image-grid"></div><div class="panel form-panel">
<form id="quality-form" hidden><h3>图像质量评价</h3><label>您认为该图像是？<select name="guessed_source" required><option value="">请选择</option><option value="real">真实增强 CT</option><option value="virtual">合成增强 CT</option><option value="unsure">无法判断</option></select></label><label>整体质量评分<select name="quality_score" required><option value="">请选择</option><option value="1">1 — 无法用于诊断</option><option value="2">2 — 明显影响诊断</option><option value="3">3 — 基本可用于诊断</option><option value="4">4 — 质量良好</option><option value="5">5 — 质量优秀</option></select></label><label>判断把握程度<select name="guess_confidence" required><option value="">请选择</option><option value="1">1 — 极低</option><option value="2">2 — 较低</option><option value="3">3 — 中等</option><option value="4">4 — 较高</option><option value="5">5 — 极高</option></select></label><button>提交评阅</button></form>
<form id="diagnosis-form" hidden><h3>病灶诊断评价</h3><p class="muted">点击影像可添加病灶定位点。</p><label>目标病灶可见性<select name="lesion_visible" required><option value="">请选择</option><option value="yes">可见</option><option value="no">不可见</option><option value="unsure">不确定</option></select></label><label>主要疾病分类<select name="diagnosis" required><option value="">请选择</option><option>HCC</option><option>ICC</option><option>MET</option><option>FNH</option><option>HEM</option><option>CYST</option><option>OTHER</option><option>NONE</option><option>UNKNOWN</option></select></label><label>恶性风险（0–100）<input name="malignancy_score" type="number" min="0" max="100" value="50" required></label><label>诊断置信度<select name="confidence" required><option value="">请选择</option><option value="1">1 — 极低</option><option value="2">2 — 较低</option><option value="3">3 — 中等</option><option value="4">4 — 较高</option><option value="5">5 — 极高</option></select></label><label>是否推荐进一步检查<select name="further_exam"><option value="no">否</option><option value="yes">是</option></select></label><label>追加检查建议<input name="exam_type" placeholder="例如 MRI / CECT / 随访"></label><div class="line"><span class="muted" id="points">已标记 0 个位置</span><button type="button" class="ghost" id="clear-points">清除标注</button></div><button>提交诊断</button></form></div></div></div>
</section><div id="notice" role="status"></div></main><script src="/static/app.js"></script></body></html>
