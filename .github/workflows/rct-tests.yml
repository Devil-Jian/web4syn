name: RCT v2 tests
on:
  push:
    branches:
      - feat/three-arm-rw-rct-v2
  pull_request:
    paths:
      - "app/**"
      - "static/rct*"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/rct-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests
      - run: node --check static/rct.js
      - run: python -m pytest -q
