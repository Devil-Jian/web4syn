name: web4syn-rct

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: web4syn:rct-v2
    container_name: web4syn-rct
    restart: unless-stopped
    environment:
      WEB4SYN_DATA: /app/data
      WEB4SYN_RCT_ADMIN_PASSWORD: \${WEB4SYN_RCT_ADMIN_PASSWORD:?Set_a_12_character_or_longer_admin_password_in_dot_env}
      WEB4SYN_ENABLE_LEGACY_DEMO: "0"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: \${WEB4SYN_DATA_PATH:-/var/lib/web4syn}
        target: /app/data
      - type: bind
        source: \${WEB4SYN_PACKS_PATH:-/home/ch4090/ytwillv2/zhongj/dataset/train_output/syn-final-1013/doctor_reading_packs}
        target: /packs
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/rct', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    init: true
